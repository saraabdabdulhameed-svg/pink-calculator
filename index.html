<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلتي الحاسبة الوردية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly value="0">

        <div class="buttons">
            <!-- الصف الأول: C، وقسمة، وضرب، وناقص -->
            <button class="btn-clear" onclick="clearDisplay()">C</button>
            <button class="btn-op" onclick="appendValue('/')">÷</button>
            <button class="btn-op" onclick="appendValue('*')">×</button>
            <button class="btn-op" onclick="appendValue('-')">-</button>

            <!-- الصف الثاني: 7، 8، 9، وزائد -->
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="btn-op" onclick="appendValue('+')">+</button>

            <!-- الصف الثالث: 4، 5، 6 (وزر التساوي سيأخذ مكاناً مناسباً) -->
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="btn-equal" onclick="calculate()">=</button>

            <!-- الصف الرابع: 1، 2، 3 -->
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>

            <!-- الصف الخامس: الصفر والنقطة -->
            <button class="btn-zero" onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
